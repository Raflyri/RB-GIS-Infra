# ==============================================================================
# infra/proxmox/nginx/nginx.conf
# Konfigurasi Nginx Reverse Proxy Produksi untuk CT 430 (gis-nginx - 172.16.10.133)
# Target penempatan di CT 430: /etc/nginx/nginx.conf
#
# Arsitektur Routing:
#   Cloudflare Tunnel (cloudflared -> http://127.0.0.1:80)
#     ├── /api/           -> CT 440 (FastAPI Backend : 172.16.10.130:8000)
#     ├── /internal-pdf/  -> Internal X-Accel-Redirect -> /mnt/synology/LDKH-Documents (ro=1)
#     └── /               -> CT 410 (Next.js Frontend : 172.16.10.131:3000)
# ==============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging dengan dukungan CF-Connecting-IP dari Cloudflare Tunnel
    log_format ldkh_main '$remote_addr - $http_cf_connecting_ip [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log ldkh_main;
    error_log /var/log/nginx/error.log warn;

    # Kompresi Gzip untuk payload GeoJSON & aset statis Next.js
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/geo+json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Ukuran maksimal payload untuk metadata GeoJSON & OCR JSON
    client_max_body_size 50M;

    # Percayai header X-Forwarded-* / CF-Connecting-IP dari loopback cloudflared
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    upstream ldkh_backend {
        server 172.16.10.130:8000;
        keepalive 32;
    }

    upstream ldkh_frontend {
        server 172.16.10.131:3000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name gis.rbeverything.com _;

        # Security headers produksi
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 1. Internal location untuk streaming PDF via X-Accel-Redirect
        #    Hanya dapat dipanggil secara internal oleh FastAPI Backend setelah validasi Signed JWT.
        #    Mount Synology DS218j di CT 100 dikunci Read-Only (ro=1).
        location /internal-pdf/ {
            internal;
            alias /mnt/synology/LDKH-Documents/;
            add_header Content-Type "application/pdf" always;
            add_header Content-Disposition "inline" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # 1b. Blokir akses publik ke endpoint internal Hermes (hanya via ZeroTier ke IP privat backend)
        location ^~ /api/v1/auth/guest/hermes/ {
            return 403;
        }

        # 2. Traffic API -> CT 130 (FastAPI Backend)
        location /api/ {
            proxy_pass http://ldkh_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            # Beritahu FastAPI bahwa Nginx mengaktifkan X-Accel-Redirect untuk PDF streaming
            proxy_set_header X-Accel-Enabled "true";
            proxy_set_header X-Forwarded-By-Nginx "true";

            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # 3. Optimasi caching aset statis Next.js (_next/static)
        location /_next/static/ {
            proxy_pass http://ldkh_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # 4. Traffic UI -> CT 140 (Next.js Frontend)
        location / {
            proxy_pass http://ldkh_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
