worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Ukuran maksimal payload untuk metadata GeoJSON & OCR JSON
    client_max_body_size 50M;

    upstream frontend_upstream {
        server host.docker.internal:3000;
    }

    upstream backend_upstream {
        server host.docker.internal:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers dasar
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Internal location untuk X-Accel-Redirect streaming PDF dari mount point Synology NAS
        # Hanya bisa diakses via internal redirect dari Backend FastAPI setelah validasi token
        location /internal-pdf/ {
            internal;
            alias /mnt/synology/LDKH-Documents/;
            add_header Content-Disposition "inline" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            add_header Pragma "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Blokir akses publik ke endpoint internal Hermes (hanya boleh via ZeroTier ke IP privat backend)
        location ^~ /api/v1/auth/guest/hermes/ {
            return 403;
        }

        # Reverse proxy ke FastAPI Backend
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse proxy ke Next.js Frontend (mendukung WebSocket HMR saat dev)
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
